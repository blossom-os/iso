LABEL homeos
TEXT HELP
Boot the homeOS install medium on BIOS.
It allows you to install homeOS or perform system maintenance.
ENDTEXT
MENU LABEL homeOS install medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%