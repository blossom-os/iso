LABEL blossomos
TEXT HELP
Boot the blossomOS Recovery Environment on BIOS.
It allows you to install blossomOS or perform system maintenance.
ENDTEXT
MENU LABEL blossomOS Recovery Environment (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% security=none
