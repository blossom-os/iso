name: Build blossomOS ISO

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      upload-to-r2:
        description: 'Upload to Cloudflare R2'
        required: false
        type: boolean
        default: false

env:
  ISO_NAME: ${{ inputs.iso_name || 'blossomOS' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Free up disk space
      run: |
        sudo apt-get clean
        sudo apt-get autoremove -y
        sudo docker system prune --all --force --volumes
        df -h

    - name: Start Arch Linux Docker
      run: |
        docker run --privileged -d --name archlinux-builder \
          --volume ${{ github.workspace }}:/workspace \
          archlinux:latest tail -f /dev/null
        docker exec archlinux-builder pacman -Syu --noconfirm
        docker exec archlinux-builder pacman -S --noconfirm archiso git base-devel wget curl

    - name: Prepare archiso profile
      run: |
        docker exec archlinux-builder bash -c "
          set -e
          cd /workspace

          # Copy releng profile
          cp -r /usr/share/archiso/configs/releng ./archiso-config

          # Copy custom overlays
          if [ -d /workspace/archiso-custom ]; then
            cp -r /workspace/archiso-custom/* ./archiso-config/
          fi

          cd archiso-config

          # Set ISO name and label
          sed -i 's/iso_name=\"archlinux\"/iso_name=\"${{ env.ISO_NAME }}\"/' profiledef.sh
          sed -i 's/iso_label=\"ARCH_\$(date +%Y%m)\"/iso_label=\"$(echo ${{ env.ISO_NAME }} | tr '[:lower:]' '[:upper:]')_\$(date +%Y%m)\"/' profiledef.sh

          # Copy airootfs overlays
          if [ -d /workspace/airootfs ]; then
            cp -r /workspace/airootfs/* airootfs/ 2>/dev/null || true
          fi

          # Make scripts executable
          find airootfs -type f -name '*.sh' -exec chmod +x {} \;

          # Add custom local packages
          if [ -d /workspace/packages ]; then
            mkdir -p /workspace/airootfs
            for pkg in /workspace/packages/*.pkg.tar.zst; do
                [ -f "$pkg" ] || continue
                tar -I zstd -xf "$pkg" -C /workspace/airootfs
                rm -f /workspace/airootfs/.MTREE /workspace/airootfs/.PKGINFO /workspace/airootfs/.INSTALL
            done
          fi

          # Append extra packages from repo file
          if [ -f /workspace/packages.x86_64 ]; then
            cat /workspace/packages.x86_64 >> packages.x86_64
          fi
        "

    - name: Build ISO
      run: |
        docker exec archlinux-builder bash -c "
          cd /workspace/archiso-config
          mkarchiso -v -w work -o out .
        "
        mv archiso-config/out/*.iso ./ || true

    - name: Get ISO info
      id: iso_info
      run: |
        ISO_FILE=$(ls *.iso | head -n1)
        ISO_SIZE=$(du -h "$ISO_FILE" | cut -f1)
        echo "iso_file=$ISO_FILE" >> $GITHUB_OUTPUT
        echo "iso_size=$ISO_SIZE" >> $GITHUB_OUTPUT
        echo "Built ISO: $ISO_FILE ($ISO_SIZE)"

    - name: Upload ISO artifact
      if: inputs.upload-to-r2 != true && github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ISO_NAME }}-iso
        path: "*.iso"
        retention-days: 30

    - name: Upload ISO to Cloudflare R2
      if: inputs.upload-to-r2 == true && github.event_name != 'pull_request'
      id: upload_r2
      env:
        RCLONE_CONFIG_R2_TYPE: s3
        RCLONE_CONFIG_R2_PROVIDER: Cloudflare
        RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
        R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
      run: |
        sudo apt-get update && sudo apt-get install -y rclone
        
        ISO_FILE=$(ls *.iso | head -n 1)
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        ISO_DEST="${TIMESTAMP}_${ISO_FILE}"

        # Upload ISO with timestamp
        rclone copyto "$ISO_FILE" "r2:${R2_BUCKET}/iso/${ISO_DEST}" --progress

        R2_URL="${R2_PUBLIC_URL}/iso/${ISO_DEST}"
        echo "ISO uploaded to: $R2_URL"
        echo "r2_url=$R2_URL" >> $GITHUB_OUTPUT
        echo "r2_key=iso/${ISO_DEST}" >> $GITHUB_OUTPUT

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          archiso-config/work/build.log
          archiso-config/work/*/build.log
        retention-days: 7
        if-no-files-found: ignore

    - name: Create release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: "*.iso"
        body: |
          ## ${{ env.ISO_NAME }} blossomOS ISO
          
          **File:** ${{ steps.iso_info.outputs.iso_file }}
          **Size:** ${{ steps.iso_info.outputs.iso_size }}
          **Built from:** ${{ github.sha }}
          **Download URL:** ${{ steps.upload_r2.outputs.r2_url }}
          
          This ISO was automatically built using GitHub Actions and uploaded to Cloudflare R2.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    runs-on: ubuntu-latest
    needs: build-iso
    if: always() && inputs.upload-to-r2 == true

    steps:
    - name: Clean up old R2 objects
      env:
        RCLONE_CONFIG_R2_TYPE: s3
        RCLONE_CONFIG_R2_PROVIDER: Cloudflare
        RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
      run: |
        sudo apt-get update && sudo apt-get install -y rclone
        
        # Keep last 10 ISOs (based on filename sort)
        rclone lsf "r2:${R2_BUCKET}/iso/" --format p | sort -r | tail -n +11 | while read file; do
          echo "Deleting old ISO: $file"
          rclone delete "r2:${R2_BUCKET}/iso/$file" || true
        done
