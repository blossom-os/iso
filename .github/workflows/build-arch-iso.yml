name: Build blossomOS ISO

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      iso_name:
        description: 'Custom ISO name'
        required: false
        default: 'blossomOS'
        type: string
      include_aur:
        description: 'Include AUR packages'
        required: false
        default: false
        type: boolean

env:
  ISO_NAME: ${{ inputs.iso_name || 'blossomOS' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        df -h

    - name: Set up blossomOS environment
      run: |
        docker run --privileged -d \
          --name archlinux-builder \
          --volume ${{ github.workspace }}:/workspace \
          --volume /tmp:/tmp \
          archlinux:latest tail -f /dev/null
        
        docker exec archlinux-builder pacman -Syu --noconfirm
        docker exec archlinux-builder pacman -S --noconfirm archiso git base-devel wget curl

    - name: Prepare archiso profile
      run: |
        docker exec archlinux-builder bash -c "
          cd /workspace
          cp -r /usr/share/archiso/configs/releng ./archiso-config
          cp -r /workspace/archiso-custom/ ./archiso-config
          rm -f ./archiso-config/efiboot/loader/entries/02-archiso-speech-linux.conf
          rm -f ./archiso-config/syslinux/splash.png

          pacman -Sy --noconfirm grub
          
          cd archiso-config
          sed -i 's/iso_name=\"archlinux\"/iso_name=\"${{ env.ISO_NAME }}\"/' profiledef.sh
          sed -i 's/iso_label=\"ARCH_\$(date +%Y%m)\"/iso_label=\"$(echo ${{ env.ISO_NAME }} | tr '[:lower:]' '[:upper:]')_\$(date +%Y%m)\"/' profiledef.sh
          
          if [ -f /workspace/packages.x86_64 ]; then
            cat /workspace/packages.x86_64 >> packages.x86_64
          fi
          
          if [ -d /workspace/airootfs ]; then
            cp -r /workspace/airootfs/* airootfs/ 2>/dev/null || true
          fi
          
          find airootfs -type f -name '*.sh' -exec chmod +x {} \\;
        "

    - name: Build ISO
      run: |
        docker exec archlinux-builder bash -c "
          cd /workspace/archiso-config
          mkarchiso -v -w work -o out .
          mv out/*.iso /workspace/
        "

    - name: Get ISO info
      id: iso_info
      run: |
        ISO_FILE=$(ls *.iso | head -n 1)
        ISO_SIZE=$(du -h "$ISO_FILE" | cut -f1)
        echo "iso_file=$ISO_FILE" >> $GITHUB_OUTPUT
        echo "iso_size=$ISO_SIZE" >> $GITHUB_OUTPUT
        echo "Built ISO: $ISO_FILE ($ISO_SIZE)"

    - name: Upload ISO to Cloudflare R2
      id: upload_r2
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
        R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
      run: |
        sudo apt-get update && sudo apt-get install -y rclone
        
        mkdir -p ~/.config/rclone
        cat > ~/.config/rclone/rclone.conf << EOF
        [r2]
        type = s3
        provider = Cloudflare
        access_key_id = $R2_ACCESS_KEY_ID
        secret_access_key = $R2_SECRET_ACCESS_KEY
        endpoint = $R2_ENDPOINT
        EOF

        ISO_FILE=$(ls *.iso | head -n 1)
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        ISO_DEST="${TIMESTAMP}_${ISO_FILE}"

        # Upload ISO with timestamp
        rclone copyto "$ISO_FILE" "r2:${R2_BUCKET}/iso/${ISO_DEST}" --progress

        R2_URL="${R2_PUBLIC_URL}/iso/${ISO_DEST}"
        echo "ISO uploaded to: $R2_URL"
        echo "r2_url=$R2_URL" >> $GITHUB_OUTPUT
        echo "r2_key=iso/${ISO_DEST}" >> $GITHUB_OUTPUT

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          archiso-config/work/build.log
          archiso-config/work/*/build.log
        retention-days: 7
        if-no-files-found: ignore

    - name: Create release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: "*.iso"
        body: |
          ## ${{ env.ISO_NAME }} blossomOS ISO
          
          **File:** ${{ steps.iso_info.outputs.iso_file }}
          **Size:** ${{ steps.iso_info.outputs.iso_size }}
          **Built from:** ${{ github.sha }}
          **Download URL:** ${{ steps.upload_r2.outputs.r2_url }}
          
          This ISO was automatically built using GitHub Actions and uploaded to Cloudflare R2.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    runs-on: ubuntu-latest
    needs: build-iso
    if: always()

    steps:
    - name: Clean up old R2 objects
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET: ${{ secrets.R2_BUCKET }}
      run: |
        sudo apt-get update && sudo apt-get install -y rclone
        
        mkdir -p ~/.config/rclone
        cat > ~/.config/rclone/rclone.conf << EOF
        [r2]
        type = s3
        provider = Cloudflare
        access_key_id = $R2_ACCESS_KEY_ID
        secret_access_key = $R2_SECRET_ACCESS_KEY
        endpoint = $R2_ENDPOINT
        EOF

        # Keep last 10 ISOs (based on filename sort)
        rclone lsf "r2:${R2_BUCKET}/iso/" --format p | sort -r | tail -n +11 | while read file; do
          echo "Deleting old ISO: $file"
          rclone delete "r2:${R2_BUCKET}/iso/$file" || true
        done
